[project]
name = "zero-trust-cop"
version = "0.1.0"
description = "Deterministic Dec-POMDP cop-and-thief game engine (Phase 1: base logic)."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `tests/_support` holds importable test doubles. It is NOT a package and
# is named so it cannot collide with anything under `src` the way a
# `tests/scripts` package would collide with `scripts`.
pythonpath = ["src", "tests/_support"]
# importlib mode + no __init__.py in tests/ avoids the src-layout name clash
# between the source package `engine` and the test dir (both would be `engine`).
addopts = ["--import-mode=importlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# The repo had no ruff config, so an unconfigured run reported 239 findings
# across rule families this project never adopted -- including ones it
# deliberately violates with a written reason at the site. A linter with no
# declared rule set measures the linter's defaults, not the code.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Correctness and hygiene we DO subscribe to. Deliberately not the whole
# catalogue: each family below is one we are willing to keep at zero.
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "PIE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# A fixture imported for its side effect and then taken as a parameter reads
# as a redefinition. It is the documented pytest idiom, and `tests/_support`
# exists precisely so fixtures can be shared.
"tests/**" = ["F811", "E402", "E741"]
# Re-exported on purpose so callers reach for one module; the docstrings say
# which and why.
"src/mcp_server/smell_trail.py" = ["F401"]
