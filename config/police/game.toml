[strategy]
learning_rate = 0.1
discount_factor = 0.9
exploration_rate = 0.1
initial_q_value = 0.0
# Refused move (barrier or edge). Raised from -1.0 for the
# diverse-opponent phase: spatial awareness is the thing a
# varied barrier layout is meant to teach.
invalid_move_penalty = -1.5
# Living penalty applied on every turn that is not a capture, so a
# shorter pursuit is worth more than a longer one. Kept two orders of
# magnitude below the terminal payoffs: the outcome still dominates.
step_cost = -0.1
honesty_prior = 0.5
qtable_path = "data/q_table_police.json"
epsilon_decay_factor = 0.999
epsilon_floor = 0.01
num_games = 2000
hint_max_words = 15
match_exploration_rate = 0.0
# TRAINING priority. Distance leads so the cop can actually compete with
# the Phase 11 evader: under qtable_primary the series collapses to 0.05%
# capture and every learned value records a loss.
policy_mode = "manhattan_primary"
# MATCH priority, re-measured after diverse-opponent training (PLAN.md
# §10.10). Distance-first is now better on every opponent: 100.0 / 29.8 /
# 45.5 against random / greedy / trained, where qtable_primary scores
# 99.5 / 20.0 / 40.2. The self-play-era inversion did not survive a table
# trained against a pool.
match_policy_mode = "manhattan_primary"

[network]
host = "127.0.0.1"
my_port = 8802
opponent_url = "http://127.0.0.1:8801/mcp"
# Public tunnel (ngrok / Localtonet) for league matches. Empty means
# loopback only; set host = "0.0.0.0" to expose this peer.
public_url = ""

[game.repos]
cop = "https://github.com/aviayeli/zero-trust-cop"
thief = "https://github.com/aviayeli/zero-trust-thief"

[email]
# Where the end-of-series report goes.
recipient = "rmisegal+uoh26finalgame@gmail.com"
# auto  = send if credentials exist, otherwise write a local draft
# draft = never send; always write the draft artifact
# send  = require a real send; report failure rather than drafting
mode = "auto"
