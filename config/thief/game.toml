[strategy]
learning_rate = 0.1
discount_factor = 0.9
exploration_rate = 0.1
initial_q_value = 0.0
# Refused move (barrier or edge). Raised from -1.0 for the
# diverse-opponent phase: spatial awareness is the thing a
# varied barrier layout is meant to teach.
invalid_move_penalty = -1.5
# Living penalty applied on every turn that is not a capture, so a
# shorter pursuit is worth more than a longer one. Kept two orders of
# magnitude below the terminal payoffs: the outcome still dominates.
step_cost = -0.05
honesty_prior = 0.5
qtable_path = "data/q_table_thief.json"
# Tuned for the 10,000-episode diverse run: 0.1 * d^n reaches the
# 0.01 floor at episode ~8994. The previous 0.999 was calibrated for
# a 2,000-game series and floored at 2,302 here, leaving 77% of
# training at minimum exploration against a POOL of opponents.
epsilon_decay_factor = 0.999744
epsilon_floor = 0.01
num_games = 2000
hint_max_words = 15
match_exploration_rate = 0.0
# Distance decides, the trained table breaks ties among equally-evasive
# moves — the same priority the cop ships (PLAN.md §10.10). The evader
# kept qtable_primary until the audit measured it: 9.5% survival against
# our strongest cop, against 93.0% for this mode on the SAME table.
policy_mode = "manhattan_primary"
# MATCH priority, re-measured after diverse-opponent training. Against a
# heuristic cop it never trained against, the evader now survives 90.0%
# here against 83.8% under qtable_primary — and 69.8% carrying no table at
# all, so the learned values are finally an ASSET (PLAN.md §10.10).
match_policy_mode = "manhattan_primary"

[network]
host = "0.0.0.0"
my_port = 8801
# The police peer on this machine. League play repoints this at the
# opponent's tunnel via --opponent-url; the shipped default is loopback,
# so the pair runs out-of-the-box with no external dependency.
opponent_url = "http://127.0.0.1:8802/mcp"
# How often a remote match asks a peer whether the turn resolved yet.
# Only used against a REMOTE opponent, where our reveal may land first
# and the gate answers "waiting" instead of the turn result.
poll_interval_sec = 0.5
# Public tunnel (ngrok / Localtonet) for league matches. Empty means
# loopback only; set host = "0.0.0.0" to expose this peer.
public_url = ""

[game.repos]
cop = "https://github.com/aviayeli/zero-trust-cop"
thief = "https://github.com/aviayeli/zero-trust-thief"

[email]
# Where the end-of-series report goes.
recipient = "rmisegal+uoh26finalgame@gmail.com"
# auto  = send if credentials exist, otherwise write a local draft
# draft = never send; always write the draft artifact
# send  = require a real send; report failure rather than drafting
mode = "auto"
