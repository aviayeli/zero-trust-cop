[strategy]
learning_rate = 0.1
discount_factor = 0.9
exploration_rate = 0.1
initial_q_value = 0.0
invalid_move_penalty = -1.0
# Living penalty applied on every turn that is not a capture, so a
# shorter pursuit is worth more than a longer one. Kept two orders of
# magnitude below the terminal payoffs: the outcome still dominates.
step_cost = -0.01
honesty_prior = 0.5
qtable_path = "data/q_table_thief.json"
epsilon_decay_factor = 0.999
epsilon_floor = 0.01
num_games = 2000
hint_max_words = 15
match_exploration_rate = 0.0
# Distance decides, the trained table breaks ties among equally-evasive
# moves — the same priority the cop ships (PLAN.md §10.10). The evader
# kept qtable_primary until the audit measured it: 9.5% survival against
# our strongest cop, against 93.0% for this mode on the SAME table.
policy_mode = "manhattan_primary"
# MATCH priority, measured separately and NOT the same as training. The
# distance rule leading is what makes self-play contested, but at match
# time it measures WORSE for the evader against an opponent it did not
# train against: 2.2% survival vs a heuristic cop, against 8.0% here
# (PLAN.md §10.10). Both figures are poor; this is the better one.
match_policy_mode = "qtable_primary"

[network]
host = "127.0.0.1"
my_port = 8801
opponent_url = "http://127.0.0.1:8802/mcp"
# Public tunnel (ngrok / Localtonet) for league matches. Empty means
# loopback only; set host = "0.0.0.0" to expose this peer.
public_url = ""

[game.repos]
cop = "https://github.com/aviayeli/zero-trust-cop"
thief = "https://github.com/aviayeli/zero-trust-thief"

[email]
# Where the end-of-series report goes.
recipient = "rmisegal+uoh26finalgame@gmail.com"
# auto  = send if credentials exist, otherwise write a local draft
# draft = never send; always write the draft artifact
# send  = require a real send; report failure rather than drafting
mode = "auto"
